name: Build check & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Пересобираем сайт из story*.py + JSON и проверяем, что site/ совпадает.
    # Ловит правки HTML руками мимо исходников.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild site
        working-directory: src
        run: python build_all.py
      - name: Verify site/ matches the build
        run: |
          git diff --exit-code -- site/ src/template_genes.html \
            || { echo '::error::site/ не совпадает с пересборкой — правьте story*.py и запускайте build_all.py'; exit 1; }

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
